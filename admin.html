<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — Lophera Store</title><link rel="stylesheet" href="style.css">
</head>
<body class="admin">
<div class="admin-head"><img src="assets/logo.svg" style="width:130px;filter:brightness(0) invert(1)"><div class="admin-head-actions"><span id="adminEmail"></span><a class="btn" style="color:#fff;border-color:#cdb4d5" href="index.html">Ver loja</a><button id="logoutBtn" class="btn" style="color:#fff;border-color:#cdb4d5;display:none" onclick="logout()">Sair</button></div></div>

<div id="loginView" class="login-shell">
  <div class="login-card">
    <div class="small">LOPHERA STORE</div><h1>Painel administrativo</h1>
    <p>Entre com a conta administradora da loja.</p>
    <form class="form" onsubmit="login(event)">
      <label>E-mail<input id="loginEmail" type="email" value="lopherastore@gmail.com" required></label>
      <label>Senha<input id="loginPassword" type="password" required autocomplete="current-password"></label>
      <button class="btn solid" type="submit">Entrar</button>
    </form><div id="loginMsg" class="form-msg"></div>
  </div>
</div>

<div id="adminView" class="admin-wrap" style="display:none">
  <div class="notice"><b>Painel conectado ao Supabase.</b> As alterações feitas aqui passam a valer no catálogo online. As fotos novas são enviadas para o Storage <code>product-images</code>.</div>
  <div class="admin-toolbar"><button class="btn solid" onclick="newProduct()">+ Novo produto</button><input id="adminSearch" class="search" placeholder="Buscar produto..." oninput="renderAdminList()"></div>
  <div class="admin-grid">
    <div class="panel">
      <h3 id="formTitle">Novo produto</h3>
      <form class="form" id="productForm" onsubmit="saveProduct(event)">
        <input id="editId" type="hidden">
        <label>Nome<input id="n" required></label>
        <div class="form-two"><label>Preço<input id="p" type="number" min="0" step=".01" required></label><label>Preço promocional<input id="pp" type="number" min="0" step=".01"></label></div>
        <label>Categoria<select id="c"></select></label>
        <label>Descrição<textarea id="d" rows="6"></textarea></label>
        <div class="form-two"><label>Cores <small>(separe por vírgula)</small><input id="co" placeholder="Preto, Branco"></label><label>Tamanhos <small>(separe por vírgula)</small><input id="s" placeholder="P, M, G, GG"></label></div>
        <label>Estoque por combinação<input id="stock" type="number" min="0" value="0"></label>
        <label>Foto principal<input id="photo" type="file" accept="image/*"></label>
        <div id="currentImage"></div>
        <div class="checks"><label><input id="active" type="checkbox" checked> Produto ativo</label><label><input id="featured" type="checkbox"> Destaque</label></div>
        <div class="form-actions"><button class="btn solid" type="submit">Salvar produto</button><button class="btn" type="button" onclick="newProduct()">Limpar</button></div>
        <div id="formMsg" class="form-msg"></div>
      </form>
    </div>
    <div class="panel"><h3>Produtos cadastrados</h3><div id="adminList" class="admin-list"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body></html>
